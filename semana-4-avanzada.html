<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
:root{--bg:#e9f3ff;--ink:#1d2b5e;--ink2:#4b5a8c;--sun:#ffc21a;--sky:#2f7ff0;--ok:#16a870;--no:#e8574a;--display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--body:'Andika','Comic Sans MS',system-ui,sans-serif;color-scheme:light;background:var(--bg)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:400 18px/1.35 var(--body);padding:14px 16px 48px;-webkit-user-select:none;user-select:none}
h1,h2,p{margin:0}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.app{max-width:720px;margin:0 auto}
.i-s1{--c:#2f7ff0;--soft:#dcecff}.i-s2{--c:#14a679;--soft:#d6f5e8}.i-s3{--c:#e84a92;--soft:#ffe0ee}.i-s4{--c:#7a4fe6;--soft:#ece3ff}
.mas{display:block;overflow:visible}.mas .m-cheer{display:none}.mas[data-mood="cheer"] .m-idle{display:none}.mas[data-mood="cheer"] .m-cheer{display:block}.mas[data-mood="cheer"]{animation:hop .5s ease-in-out 2}@keyframes hop{50%{transform:translateY(-12px) rotate(-6deg)}}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.top .mas{width:76px;height:76px;flex:none}.ttl{flex:1;min-width:170px}.ttl h1{font:800 32px/1 var(--display)}.ttl p{color:var(--ink2);font-size:16px;margin-top:5px}.tools{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 14px;border:3px solid var(--ink);border-radius:999px;background:#fff;font:800 18px var(--display);box-shadow:0 3px 0 var(--ink)}
.star{color:var(--sun);-webkit-text-stroke:1.5px var(--ink)}.star.off{color:#d4dcef;-webkit-text-stroke:1.5px #9aa8cc}
.map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.isl{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;background:var(--soft);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink);text-align:left;min-width:0}
.isl:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.emb{width:64px;height:64px;flex:none;border-radius:50%;background:var(--c);border:3px solid var(--ink);display:grid;place-items:center;color:#fff;font:800 28px var(--display)}
.itx b{display:block;font:800 22px/1.05 var(--display)}.itx span{display:block;color:var(--ink2);font-size:14px;margin:4px 0 6px}.itx .sc{font:800 17px var(--display);color:var(--ink)}
.dif{display:inline-block;background:var(--c);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font:800 14px var(--display);margin-top:6px}
.playbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}.x{flex:none;width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);background:#fff;font:800 22px var(--display);box-shadow:0 3px 0 var(--ink)}
.dots{flex:1;display:flex;gap:7px;justify-content:center}.dot{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);background:#fff}.dot.done{background:var(--ok)}.dot.now{background:var(--sun)}
.coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}.coach .mas{width:70px;height:70px;flex:none}
.bubble{flex:1;background:#fff;border:3px solid var(--ink);border-radius:24px 24px 24px 6px;padding:12px 14px;font:800 20px/1.25 var(--display);display:flex;gap:10px;align-items:center;justify-content:space-between}
.spk{flex:none;width:48px;height:48px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:grid;place-items:center}
.stage{background:#fff;border:3px solid var(--ink);border-radius:28px;padding:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;margin-bottom:18px;box-shadow:0 5px 0 var(--ink)}
.v-emo{font-size:68px;line-height:1}.v-big{font:800 32px/1.15 var(--display);text-wrap:balance}.v-txt{font:800 22px/1.35 var(--display);text-wrap:balance;max-width:34ch}.v-steps{font:800 20px/1.55 var(--display);background:#f2f5ff;border:2px dashed var(--ink);border-radius:16px;padding:10px 14px;text-align:left}.v-how{background:#fff8dc;border:2px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:16px;text-align:left}
.opts{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr))}
.opt{min-height:72px;padding:10px;background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;justify-content:center;min-width:0}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.opt:disabled{cursor:default}.opt.bad{background:#ffe0dc;border-color:var(--no);opacity:.65;animation:shake .4s}.opt.good{background:#c9f5e2;border-color:var(--ok)}.opt.hint{animation:pulse .9s infinite}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes pulse{50%{transform:scale(1.06);background:#fff3bf}}
.big{font:800 36px/1 var(--display)}.txt{font:800 20px/1.2 var(--display);text-wrap:balance}.pic{display:flex;flex-direction:column;align-items:center;gap:2px}.oe{font-size:44px;line-height:1.1}.ot{font:800 16px/1.1 var(--display)}
.fb{min-height:32px;margin-top:14px;text-align:center;font:800 19px/1.3 var(--display)}.fb.ok{color:var(--ok)}.fb.no{color:#c2402f}
.res,.welcome,.intro{display:grid;gap:14px;justify-items:center;text-align:center;padding-top:16px}.bigstars{font-size:68px;letter-spacing:6px}.res h2,.wt,.it{font:800 30px/1.1 var(--display)}.res p,.ws,.is{font-size:18px;color:var(--ink2);max-width:58ch}.res .mas,.welcome .mas,.intro .mas{width:120px;height:120px}.btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.cta{min-height:60px;padding:0 24px;border:3px solid var(--ink);border-radius:22px;background:var(--sun);font:800 22px var(--display);box-shadow:0 5px 0 var(--ink)}.cta.alt{background:#fff}.cta:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
#name{width:100%;max-width:340px;min-height:60px;border:3px solid var(--ink);border-radius:20px;padding:0 16px;font:800 26px var(--display);text-align:center;background:#fff;color:var(--ink)}
.scorebar{display:flex;gap:8px;align-items:center;font:800 18px var(--display)}.scorebar .pillpts{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:2px 14px;box-shadow:0 3px 0 var(--ink)}
.baremo{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15px;color:var(--ink2);max-width:580px}
.baremo b{color:var(--ink)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}#fx i{position:absolute;top:-24px;width:12px;height:18px;border-radius:3px;animation:fall linear forwards}@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
@media(max-width:480px){.map{grid-template-columns:1fr}.ttl h1{font-size:28px}.bubble{font-size:18px}}
</style>
<title>Semana 4 · Nivel Avanzado · 2° primaria · 10 preguntas</title>
<div class="app"><div id="view"></div></div>
<div id="fx" aria-hidden="true"></div>
<script>
(function(){
const $=s=>document.querySelector(s);
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='misionInstrucciones.v1';
let S={name:'',voice:true,best:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let AC=null;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,v){const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(a.destination);const n=a.currentTime+t0;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.18,n+.02);g.gain.exponentialRampToValueAtTime(.001,n+d);o.start(n);o.stop(n+d+.05)}catch(e){}}
const sfx={ok(){tone(660,0,.15);tone(880,.12,.25)},no(){tone(260,0,.25,'triangle',.15)},win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.13,.3))},pop(){tone(520,0,.1,'triangle')}};
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/es[-_]MX/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(t){if(!S.voice||!t)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=voice?voice.lang:'es-MX';if(voice)u.voice=voice;u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
const MAS=()=>`<svg class="mas" viewBox="0 0 100 100" data-mood="idle" aria-hidden="true"><path d="M50 8L61 34L90 37L68 56L75 85L50 70L25 85L32 56L10 37L39 34Z" fill="#ffc21a" stroke="#1d2b5e" stroke-width="5" stroke-linejoin="round"/><circle cx="40" cy="50" r="4.5" fill="#1d2b5e"/><circle cx="60" cy="50" r="4.5" fill="#1d2b5e"/><circle cx="33" cy="58" r="4" fill="#ff7fa3" opacity=".85"/><circle cx="67" cy="58" r="4" fill="#ff7fa3" opacity=".85"/><path class="m-idle" d="M42 60Q50 68 58 60" fill="none" stroke="#1d2b5e" stroke-width="3.5" stroke-linecap="round"/><path class="m-cheer" d="M40 58Q50 78 60 58Z" fill="#1d2b5e" stroke="#1d2b5e" stroke-width="2" stroke-linejoin="round"/></svg>`;
const SPK=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1d2b5e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#1d2b5e"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>`;
function mood(m){document.querySelectorAll('.mas').forEach(s=>{s.dataset.mood=m;if(m!=='idle')setTimeout(()=>{s.dataset.mood='idle'},1100)})}
const stars=(n,max=3)=>Array.from({length:max},(_,i)=>`<span class="star${i<n?'':' off'}">★</span>`).join('');
const view=h=>{$('#view').innerHTML=h;try{window.scrollTo(0,0)}catch(e){}};
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const fx=$('#fx');const cols=['#f0553f','#2f7ff0','#14a679','#e84a92','#ffc21a','#8a5cf6'];for(let i=0;i<48;i++){const s=document.createElement('i');s.style.cssText=`left:${rnd(100)}%;background:${pick(cols)};animation-delay:${Math.random()*.6}s;animation-duration:${1.8+Math.random()*1.4}s`;fx.appendChild(s)}setTimeout(()=>{fx.innerHTML=''},3800)}
const Q=(say,vis,right,wrong,o)=>Object.assign({say,vis,opts:shuffle([{h:right,ok:1},...wrong.map(h=>({h}))])},o||{});
const nO=n=>`<span class="big">${n}</span>`;
const tO=t=>`<span class="txt">${t}</span>`;
const pO=(e,t)=>`<span class="pic"><span class="oe">${e}</span><span class="ot">${t}</span></span>`;
// ============ SEMANA 1 · INTERMEDIA · 2° primaria ============
const W1=[
Q('Primero me pongo los zapatos, después tomo mi mochila. ¿Qué hago primero? Dime el paso número 1.','<div class="v-emo">👟 ➡️ 🎒</div><div class="v-steps">1️⃣ Me pongo los zapatos<br>2️⃣ Tomo mi mochila</div><div class="v-txt">¿Cuál es el paso 1?</div>',tO('Me pongo los zapatos'),[tO('Tomo la mochila'),tO('Me lavo los dientes')],{p:'Secuencia de 2 pasos',fb:'Primero es el paso 1. Paso 1: zapatos. Paso 2: mochila.'}),
Q('Para lavarte los dientes hay 3 pasos: 1 toma el cepillo, 2 pon pasta, 3 cepilla. ¿Qué haces en el paso 2?','<div class="v-steps">1️⃣ Toma el cepillo 🪥<br>2️⃣ Pon pasta 🧴<br>3️⃣ Cepilla 😁</div>',tO('Pongo pasta'),[tO('Tomo el cepillo'),tO('Me duermo')],{p:'Secuencia de 3 pasos',fb:'Cuenta con tus dedos: 1 cepillo, 2 pasta, 3 cepilla. Paso 2 es pasta.'}),
Q('El gato está ENCIMA de la caja. Encima quiere decir arriba. ¿Dónde está el gato?','<div class="v-emo">🐱</div><div class="v-emo">📦</div><div class="v-txt">Encima = arriba</div>',tO('Encima de la caja'),[tO('Debajo de la caja'),tO('Lejos de la caja')],{p:'Ubicación: encima',fb:'Encima significa arriba. El gato está arriba de la caja.'}),
Q('El perro está DENTRO de la casa. Dentro quiere decir adentro. ¿Dónde está?','<div class="v-emo">🏠</div><div class="v-txt">🐶 está dentro de 🏠</div>',tO('Dentro de la casa'),[tO('Fuera de la casa'),tO('Encima de la casa')],{p:'Ubicación: dentro / fuera',fb:'Dentro es adentro. El perro está adentro de la casa.'}),
Q('Mira de izquierda a derecha: manzana, perro, plátano. El perro está en medio. ¿Qué está a la IZQUIERDA del perro? La izquierda es donde está tu corazón.','<div class="v-emo">🍎 🐶 🍌</div><div class="v-txt">⬅️ izquierda · derecha ➡️</div>',pO('🍎','Manzana'),[pO('🍌','Plátano'),pO('🐶','Perro')],{p:'Izquierda y derecha',fb:'Mira al perro. A su izquierda (⬅️) está la manzana.'}),
Q('Todos son rojos menos uno. ¿Cuál NO es rojo? Fíjate bien en el color.','<div class="v-emo">🍎 🍓 🚗</div><div class="v-txt">¿Cuál es diferente?</div>',pO('🚗','Carro azul'),[pO('🍎','Manzana roja'),pO('🍓','Fresa roja')],{p:'Clasificación por color',fb:'Manzana y fresa son rojas. El carro azul NO es rojo.'}),
Q('¿Cuál animal es el más GRANDE? Compara sus tamaños.','<div class="v-emo">🐘 🐱 🐭</div>',pO('🐘','Elefante'),[pO('🐱','Gato'),pO('🐭','Ratón')],{p:'Clasificación por tamaño',fb:'El elefante es gigante, el gato mediano y el ratón chiquito.'}),
Q('En la mañana haces 3 cosas en orden: 1 me levanto, 2 me visto, 3 desayuno. ¿Qué haces al FINAL? Final es lo último.','<div class="v-steps">1️⃣ Me levanto 🛏️<br>2️⃣ Me visto 👕<br>3️⃣ Desayuno 🥣</div>',tO('Desayuno'),[tO('Me levanto'),tO('Me visto')],{p:'Secuencia: final',fb:'Final = paso 3. Lo último es desayunar.'}),
Q('¿Cuál puede RODAR? Piensa cuál tiene forma redonda.','<div class="v-emo">⚽ 📦 📕</div>',pO('⚽','Pelota'),[pO('📦','Caja'),pO('📕','Libro')],{p:'Clasificación por forma',fb:'La pelota es redonda y rueda. La caja y el libro no.'}),
Q('Para comer una manzana: 1 la lavo, 2 la pelo, 3 me la como. ¿Qué hago en el paso 2?','<div class="v-steps">1️⃣ Lavo 🍎<br>2️⃣ Pelo 🔪<br>3️⃣ Como 😋</div>',tO('La pelo'),[tO('La lavo'),tO('La tiro')],{p:'Secuencia de 3 pasos',fb:'Paso 2: pelar. Repite: lavo, pelo, como.'}),
];
// ============ SEMANA 2 · INTERMEDIA-ALTA · 2° primaria ============
const W2=[
Q('Si está lloviendo y vas a salir, ¿qué debes llevar para no mojarte? Piensa: ¿qué te tapa la lluvia?','<div class="v-emo">🌧️ 🎒</div><div class="v-big">Si llueve… ¿qué llevo?</div>',pO('☔','Paraguas'),[pO('🕶️','Lentes de sol'),pO('🩴','Chanclas')],{p:'Condición: si llueve',fb:'Si llueve, la condición se cumple y necesitas paraguas. Los lentes son para el sol.'}),
Q('Aunque haya juguetes, si tienes mucho sueño, ¿qué debe hacer tu cuerpo?','<div class="v-emo">🥱 🧸 😴</div>',pO('🛏️','Dormir'),[pO('⚽','Seguir jugando'),pO('🏃','Correr')],{p:'Condición',fb:'La condición es tener sueño. Aunque quieras jugar, tu cuerpo necesita dormir.'}),
Q('¿Cuál sirve para ESCRIBIR en la escuela? Piensa para qué se usa cada cosa.','<div class="v-emo">✏️ 🍎 ⚽</div>',pO('✏️','Lápiz'),[pO('🍎','Manzana'),pO('⚽','Pelota')],{p:'Clasificación por uso',fb:'El lápiz sirve para escribir. La manzana se come y la pelota es para jugar.'}),
Q('Toca el animal que puede VOLAR por el cielo. Piensa dónde vive cada uno.','<div class="v-emo">🐶 🦋 🐟</div>',pO('🦋','Mariposa'),[pO('🐶','Perro'),pO('🐟','Pez')],{p:'Selección',fb:'La mariposa vuela. El perro camina y el pez nada.'}),
Q('Toca la FRUTA. Ojo: la zanahoria es verdura y el queso viene de la leche.','<div class="v-emo">🍌 🥕 🧀</div>',pO('🍌','Plátano'),[pO('🥕','Zanahoria'),pO('🧀','Queso')],{p:'Clasificación fina',fb:'El plátano es fruta dulce. La zanahoria es verdura y el queso es lácteo.'}),
Q('Sigue la indicación exacta: toca el círculo ROJO. Fíjate en FORMA y COLOR a la vez.','<div class="v-emo">🔴 🔵 🟢</div><div class="v-txt">Forma: círculo · Color: rojo</div>',pO('🔴','Círculo rojo'),[pO('🔵','Círculo azul'),pO('🟢','Círculo verde')],{p:'Seguimiento exacto',fb:'Debes cumplir las dos cosas: forma círculo Y color rojo. Solo el primero cumple.'}),
Q('EXPLICACIÓN ESPECIAL: La maestra da DOS instrucciones en ORDEN. Paso 1 es PRIMERO: guarda el lápiz en la cartuchera. Paso 2 es DESPUÉS: abre el libro en la página 5. Pregunta: ¿qué haces PRIMERO, en el paso 1? Recuerda: PRIMERO = lo que va en el lugar 1.','<div class="v-steps">1️⃣ PRIMERO: guarda el lápiz ✏️ → 🎒<br>2️⃣ DESPUÉS: abre el libro 📖 pág. 5</div><div class="v-how">🔑 Truco: tapa el paso 2 con tu mano. ¿Qué queda? Eso es lo primero.<br>❌ Abrir el libro es el paso 2, va después.<br>❌ Salir a jugar no lo dijo la maestra.</div><div class="v-txt">¿Qué haces en el PASO 1?</div>',tO('Guardo el lápiz en la cartuchera'),[tO('Abro el libro en la página 5'),tO('Salgo a jugar al patio')],{p:'Pregunta 7: orden PRIMERO/DESPUÉS',fb:'MUY BIEN explicado: PRIMERO significa lugar 1. Paso 1: guardar el lápiz. Paso 2: abrir el libro. Si abres el libro antes, rompes el orden. La maestra nunca dijo salir a jugar.'}),
Q('Si es de DÍA hay sol, si es de NOCHE hay luna. Es de día y vas al parque. ¿Qué ves en el cielo?','<div class="v-emo">🌞 🌙</div>',pO('☀️','El sol'),[pO('🌙','La luna'),pO('⭐','Las estrellas')],{p:'Condición día-noche',fb:'La condición es de día. De día sale el sol. Luna y estrellas son de noche.'}),
Q('¿Cuál NO se puede COMER? Piensa si viene de la cocina o de los juguetes.','<div class="v-emo">🍎 🍞 🧸</div>',pO('🧸','Oso de peluche'),[pO('🍎','Manzana'),pO('🍞','Pan')],{p:'Clasificación',fb:'Manzana y pan son comida. El peluche es juguete, no se come.'}),
Q('Nueva regla: SI ves triángulo APLAUDES, SI ves círculo SALTAS. Miras y ves esto: triángulo rojo. ¿Qué haces? Fíjate en la FORMA.','<div class="v-emo">🔺</div><div class="v-steps">🔺 triángulo = 👏 aplaude<br>⭕ círculo = 🦘 salta</div>',tO('Aplaudo'),[tO('Salto'),tO('Me quedo quieto')],{p:'Doble condición',fb:'Ves triángulo, la regla del triángulo dice aplaude. Saltar es solo para círculo.'}),
];
// ============ SEMANA 3 · ALTA · 2° primaria ============
const W3=[
Q('Memoriza 4 pasos para lavarte las manos. Repite en voz baja: manos, jabón, agua, seca. Sin mirar, ¿qué haces en el paso 2?','<div class="v-steps">1️⃣ Manos 🙌<br>2️⃣ Jabón 🧼<br>3️⃣ Agua 💧<br>4️⃣ Seca 🖐️</div><div class="v-how">Truco: cuenta con tus 4 dedos.</div>',tO('Pongo jabón'),[tO('Mojo las manos'),tO('Me seco las manos')],{p:'4 pasos: paso 2',fb:'Repite: 1 manos, 2 jabón, 3 agua, 4 seca. Paso 2 es jabón.'}),
Q('Para salir a la escuela: 1 ponte zapatos, 2 toma mochila, 3 despídete, 4 camina. ¿Qué haces en el paso 4, al FINAL?','<div class="v-steps">1️⃣ Zapatos 👟 2️⃣ Mochila 🎒<br>3️⃣ Despídete 👋 4️⃣ Camina 🚶</div>',tO('Camino a la escuela'),[tO('Me pongo los zapatos'),tO('Me despido')],{p:'4 pasos: final',fb:'Final es el 4. Primero zapatos, luego mochila, luego adiós, al final caminar.'}),
Q('Receta del sándwich: 1 toma pan, 2 pon queso, 3 cierra el pan, 4 come. ¿Qué va en TERCER lugar?','<div class="v-emo">🍞 🧀 🥪 😋</div><div class="v-txt">1 toma · 2 queso · 3 cierra · 4 come</div>',tO('Cierra el pan'),[tO('Toma el pan'),tO('Come el sándwich')],{p:'4 pasos: tercero',fb:'Tercero = lugar 3. No es tomar (1) ni comer (4), es cerrar.'}),
Q('Juego de mesa: 1 tira el dado, 2 avanza tu ficha, 3 toma tarjeta, 4 pasa el turno. ¿Qué haces PRIMERO?','<div class="v-steps">1️⃣ Tira 🎲 2️⃣ Avanza 🏃<br>3️⃣ Tarjeta 🃏 4️⃣ Pasa ⏭️</div>',tO('Tiro el dado'),[tO('Avanzo la ficha'),tO('Paso el turno')],{p:'4 pasos: primero',fb:'Primero es el 1: tirar. Si avanzas antes, te saltas el orden.'}),
Q('Para plantar un frijol: 1 pon tierra, 2 pon semilla, 3 pon agua, 4 dale sol. ¿Qué va SEGUNDO?','<div class="v-emo">🪴 🌱 💧 ☀️</div>',tO('Pongo la semilla'),[tO('Pongo la tierra'),tO('Pongo el agua')],{p:'4 pasos: segundo',fb:'Segundo = lugar 2. Tierra es 1, semilla es 2.'}),
Q('Rutina: 1 levántate, 2 tiende la cama, 3 lávate la cara, 4 desayuna. Ya tendiste la cama (paso 2). ¿Qué sigue DESPUÉS?','<div class="v-steps">1️⃣ Levántate 2️⃣ Tiende cama ✅<br>3️⃣ Lava cara 4️⃣ Desayuna</div>',tO('Me lavo la cara'),[tO('Me levanto otra vez'),tO('Desayuno sin lavarme')],{p:'Siguiente paso',fb:'Después del 2 sigue el 3. No vuelvas al 1 ni saltes al 4.'}),
Q('Manualidad: 1 dibuja un círculo, 2 píntalo rojo, 3 recórtalo, 4 pégalo en el cuaderno. ¿Qué haces en el paso 3? Ojo: pintar es el 2.','<div class="v-emo">⭕ 🔴 ✂️ 📌</div>',tO('Lo recorto'),[tO('Lo pinto de rojo'),tO('Lo pego')],{p:'4 pasos: paso 3',fb:'Paso 3 es recortar. Pintar era el 2, pegar es el 4.'}),
Q('Para leer: 1 abre el libro, 2 lee en silencio, 3 responde preguntas, 4 cierra el libro. ¿Qué haces JUSTO ANTES de cerrar?','<div class="v-emo">📖 👀 ✏️ 📕</div><div class="v-txt">Antes de cerrar = paso 3</div>',tO('Respondo preguntas'),[tO('Abro el libro'),tO('Leo en silencio')],{p:'Orden inverso',fb:'Cerrar es el 4. Justo antes (paso 3) es responder.'}),
Q('Búsqueda del tesoro: 1 camina 3 pasos, 2 gira a la derecha, 3 abre la caja, 4 grita ¡hurra! Si ya caminaste y giraste, ¿qué sigue?','<div class="v-steps">1️⃣ Camina ✅ 2️⃣ Gira ✅<br>3️⃣ Abre 4️⃣ ¡Hurra!</div>',tO('Abro la caja'),[tO('Camino otra vez'),tO('Grito ¡hurra!')],{p:'Retención y orden',fb:'Ya hiciste 1 y 2. Sigue el 3: abrir. Gritar es hasta el 4.'}),
Q('Cruzar la calleτά: 1 miro a los lados, 2 tomo la mano de un adulto, 3 cruzo sin correr. ¿Por qué el paso 2 va ANTES de cruzar? Elige la mejor razón.','<div class="v-emo">👀 🤝 🚶</div>',tO('Porque así voy seguro con un adulto'),[tO('Porque correr es divertido'),tO('Porque miro otra vez')],{p:'Orden con razón',fb:'El orden te cuida: mirar (1), mano (2) y cruzar (3). La mano te protege.'}),
];
// ============ SEMANA 4 · AVANZADA · 2° primaria ============
const W4=[
Q('REGLA DOBLE: para salir a jugar debes cumplir LAS DOS: tarea lista Y colores guardados. Juan hizo la tarea pero NO guardó colores. ¿Puede salir?','<div class="v-emo">📝 ✅ 🖍️ ❌</div><div class="v-steps">✅ tarea + ✅ colores = jugar<br>❌ falta una = NO jugar</div>',tO('No, le falta guardar'),[tO('Sí, con la tarea basta'),tO('Sale sin permiso')],{p:'Doble condición',fb:'Doble significa dos. Le falta 1 de 2, entonces NO puede salir.'}),
Q('Lee con atención: El perro de Ana es negro, pequeño y le gusta correr en el parque. ¿Cómo es el perro? Elige lo que dice el texto.','<div class="v-emo">🐕‍🦺</div><div class="v-txt">negro, pequeño, corre</div>',tO('Negro y pequeño'),[tO('Blanco y grande'),tO('Café y dormilón')],{p:'Comprensión',fb:'El texto dice negro y pequeño. Lo demás no está escrito.'}),
Q('Piensa paso a paso: tienes 3 manzanas, te comes 1, te quedan 2. Tu mamá te da 2 más. 2 + 2 = ¿cuántas tienes ahora?','<div class="v-emo">🍎🍎🍎 ➖🍎 ➕🍎🍎</div>',nO('4'),[nO('3'),nO('5')],{p:'Razonamiento con pasos',fb:'3 menos 1 son 2. 2 más 2 son 4.'}),
Q('Si llueve y NO tienes paraguas, te mojas. Hoy llueve y no trajiste paraguas. ¿Qué te pasa?','<div class="v-emo">🌧️ ☂️❌ 💧</div>',tO('Me mojo'),[tO('Me mantengo seco'),tO('Sale el arcoíris')],{p:'Condición',fb:'Se cumplen las dos: llueve + sin paraguas = te mojas.'}),
Q('Haz LAS DOS cosas: dibuja un círculo Y píntalo azul. ¿Cuál cumple las DOS?','<div class="v-emo">⭕ 🔵</div>',tO('Círculo pintado azul'),[tO('Círculo sin pintar'),tO('Cuadrado azul')],{p:'Instrucción múltiple',fb:'Necesitas forma círculo Y color azul. Solo una opción tiene ambas.'}),
Q('Todos los pájaros tienen alas. Piolín es un pájaro. Entonces, ¿qué tiene Piolín?','<div class="v-emo">🐤 🪽</div>',tO('Alas'),[tO('Aletas'),tO('Ruedas')],{p:'Razonamiento',fb:'Si todos tienen alas y Piolín es pájaro, Piolín tiene alas.'}),
Q('El semáforo está en ROJO y hay un adulto contigo. Aun así, ¿qué debes hacer? Piensa en la regla de seguridad.','<div class="v-emo">🚦🔴 🤝</div>',tO('Me detengo y espero el verde'),[tO('Cruzo porque voy acompañado'),tO('Corro rápido')],{p:'Condición de seguridad',fb:'Rojo siempre es ALTO, incluso con adultos. Esperas el verde.'}),
Q('Ayer jugaste con tierra y ahora vas a comer. REGLA: lávate ANTES de comer y DESPUÉS de jugar con tierra. ¿Qué debes hacer? Cumples las DOS.','<div class="v-emo">🧼 ➡️ 🍽️</div>',tO('Me lavo las manos antes de comer'),[tO('Como sin lavarme'),tO('Sigo jugando')],{p:'Doble regla',fb:'Jugaste (toca lavar después) y vas a comer (toca lavar antes). Lávate.'}),
Q('Lee: Me pongo el pijama, apago la luz y abrazo mi peluche cuando voy a dormir. ¿Cuándo hago todo eso?','<div class="v-emo">🥱 🌙 🧸</div>',tO('Cuando voy a dormir'),[tO('Cuando voy a comer'),tO('Cuando voy a jugar')],{p:'Comprensión',fb:'Todo eso es rutina de dormir, no de comer ni jugar.'}),
Q('Cuenta avanzada: hay 2 gatos, 1 perro y 3 peces. ¿Cuántos animales hay? Suma por partes: 2 + 1 = 3, 3 + 3 = ?','<div class="v-emo">🐱🐱 🐶 🐟🐟🐟</div>',nO('6'),[nO('5'),nO('7')],{p:'Suma total',fb:'2 gatos + 1 perro = 3. 3 + 3 peces = 6.'}),
];
const WEEKS=[
{id:'s1',name:'Semana 1',dif:'Nivel Intermedio',sub:'Secuencias 2-3, lugares y grupos · 2° primaria',cls:'i-s1',emb:'1️⃣',qs:W1,intro:'Vas a practicar hacer pasos en ORDEN (primero, después, al final), decir DÓNDE están las cosas (encima, dentro, izquierda) y AGRUPAR por color, tamaño y forma.'},
{id:'s2',name:'Semana 2',dif:'Nivel Intermedio-Alto',sub:'Condiciones y seguimiento · 2° primaria',cls:'i-s2',emb:'2️⃣',qs:W2,intro:'Vas a practicar reglas SI... (si llueve, si es de día), elegir lo correcto y seguir indicaciones exactas. Fíjate en las palabras PRIMERO y DESPUÉS.'},
{id:'s3',name:'Semana 3',dif:'Nivel Alto',sub:'4 instrucciones en orden · 2° primaria',cls:'i-s3',emb:'3️⃣',qs:W3,intro:'Vas a MEMORIZAR 4 pasos y respetar el ORDEN. Truco: repite en voz baja y cuenta con tus dedos 1-2-3-4. Pregunta clave: ¿qué va en cada lugar?'},
{id:'s4',name:'Semana 4',dif:'Nivel Avanzado',sub:'Comprensión y razonamiento · 2° primaria',cls:'i-s4',emb:'4️⃣',qs:W4,intro:'Vas a resolver RETOS: cumplir DOS condiciones a la vez, entender textos cortos y razonar paso a paso. Lee dos veces antes de responder.'},
];
// === Versión separada: solo s4 ===
WEEKS.splice(0, WEEKS.length, ...WEEKS.filter(x=>x.id==='s4'));
let G=null,LAST=null;
const PRAISE=['¡Muy bien!','¡Excelente!','¡Eso es!','¡Genial!'];
const voiceLbl=()=>S.voice?'Voz: sí':'Voz: no';
function baremo(sc){if(sc>=9)return{t:'¡Lo lograste! 🏆',s:3,d:'9 a 10 puntos. Dominas el seguimiento de instrucciones.'};if(sc>=5)return{t:'Lo estamos logrando 🌟',s:2,d:'5 a 8 puntos. Vas muy bien, practica un poco más.'};return{t:'Requerimos reforzar 🌱',s:1,d:'1 a 4 puntos (y 0). Repasemos juntos otra vez.'}}
function viewWelcome(){view(`<div class="welcome">${MAS()}<h1 class="wt">Misión Instrucciones · 2°</h1><p class="ws">Soy Chispa. 4 juegos, uno por semana.<br>10 preguntas cada uno · <b>1 punto por acierto a la primera</b>.<br>Dificultad: S1 Intermedia → S2 Intermedia-Alta → S3 Alta → S4 Avanzada.</p><input id="name" maxlength="20" value="${esc(S.name)}" placeholder="Escribe tu nombre"><button class="cta" data-act="start">¡Empezar!</button><div class="baremo"><b>Baremo 2° primaria:</b><br>🌱 0 a 4 = Requerimos reforzar · 🌟 5 a 8 = Lo estamos logrando · 🏆 9 a 10 = ¡Lo lograste!</div></div>`);setTimeout(()=>say('Hola, soy Chispa. Escribe tu nombre para empezar la misión de segundo grado.'),300)}
function start(){const i=$('#name');S.name=i?i.value.trim().slice(0,20):S.name;save();sfx.ok();viewHome()}
function viewHome(){G=null;const n=S.name?`, ${esc(S.name)}`:'';const sep=window.__SEP?'':'';
view(`<header class="top">${MAS()}<div class="ttl"><h1>Misión Instrucciones · 2°</h1><p>¡Hola${n}! Elige tu semana. Cada una es un juego separado.</p></div><div class="tools"><button class="chip" data-act="voice">${voiceLbl()}</button><button class="chip" data-act="rename">Nombre</button></div></header><main class="map">${WEEKS.map(w=>{const b=S.best[w.id];return `<button class="isl ${w.cls}" data-act="week" data-id="${w.id}"><span class="emb">${w.emb}</span><span class="itx"><b>${w.name}</b><span>${w.sub}</span><span class="dif">${w.dif} · 10 preguntas</span><span class="sc">${b==null?'Sin jugar ⭐':'Mejor: '+b+'/10 '+(b>=9?'🏆':b>=5?'🌟':'🌱')}</span></span></button>`}).join('')}</main><div style="margin-top:14px" class="baremo"><b>Cómo se juega (2° primaria):</b> Escucha la pregunta con 🔊, mira el dibujo, elige. Solo el <b>primer intento vale 1 punto</b>. Si fallas 2 veces, ves la correcta y sigues.<br><b>Baremo:</b> 🌱 0-4 Requerimos reforzar · 🌟 5-8 Lo estamos logrando · 🏆 9-10 ¡Lo lograste!</div>`)}
function viewIntro(w){view(`<div class="intro ${w.cls}">${MAS()}<div class="dif">${w.dif}</div><h2 class="it">${w.name}: ${esc(w.sub)}</h2><p class="is">${esc(w.intro)}</p><div class="baremo" style="text-align:left"><b>📋 Instrucciones claras:</b><br>1. Son <b>10 preguntas</b>, cada acierto a la primera = <b>1 punto</b>.<br>2. Toca 🔊 para escuchar de nuevo.<br>3. Lee las palabras en MAYÚSCULAS: te dicen la clave (PRIMERO, DESPUÉS, NO, SI).<br>4. Baremo: 🌱 0-4 reforzar · 🌟 5-8 logrando · 🏆 9-10 ¡logrado!</div><div class="btns"><button class="cta" data-act="begin">▶ Empezar ${w.name}</button><button class="cta alt" data-act="quit">Mapa</button></div></div>`);say(w.name+'. '+w.intro)}
function startWeek(w){LAST=w;G={w,qs:w.id==='s2'||w.id==='s3'||w.id==='s4'?w.qs.slice():shuffle(w.qs.slice()),i:0,score:0,tries:0,locked:false,fails:[]};if(w.id!=='s1')G.qs=shuffle(G.qs);window.__G=G;viewQ()}
function viewQ(){const q=G.qs[G.i];G.tries=0;G.locked=false;window.__G=G;const dots=G.qs.map((_,i)=>`<span class="dot ${i<G.i?'done':i===G.i?'now':''}"></span>`).join('');view(`<div class="${G.w.cls}"><div class="playbar"><button class="x" data-act="quit">✕</button><div class="dots">${dots}</div><div class="scorebar"><span class="pillpts">⭐ ${G.score} pts</span></div></div><div class="coach">${MAS()}<div class="bubble"><span>Pregunta ${G.i+1} de 10 · ${G.w.dif}: ${esc(q.p||'')}</span><button class="spk" data-act="say">${SPK}</button></div></div><div class="stage">${q.vis}</div><div class="opts" style="--cols:${q.opts.length>2?1:2}">${q.opts.map((o,i)=>`<button class="opt" data-act="opt" data-i="${i}">${o.h}</button>`).join('')}</div><p class="fb" id="fb"></p></div>`);setTimeout(()=>{if(G)say('Pregunta '+(G.i+1)+'. '+q.say)},350)}
function fb(m,c){const el=$('#fb');if(el){el.textContent=m;el.className='fb '+(c||'')}}
function good(q){G.locked=true;if(G.tries===0)G.score++;sfx.ok();mood('cheer');const p=pick(PRAISE);fb(`${p} ${q.fb||''} (+1 punto)`,'ok');say(p+' '+(q.fb||''));const g=G;setTimeout(()=>{if(G===g)next()},2400)}
function wrong(q,btn){G.tries++;sfx.no();if(G.tries===1){btn.classList.add('bad');btn.disabled=true;fb('¡Casi! Lee de nuevo y fíjate en las MAYÚSCULAS. Inténtalo otra vez.','no')}
else{G.locked=true;document.querySelectorAll('.opt').forEach((b,n)=>{b.disabled=true;if(q.opts[n].ok)b.classList.add('hint')});G.fails.push(q);fb(`Respuesta correcta: ${q.fb||''} (0 puntos)`, 'no');say('La respuesta era. '+(q.fb||''));const g=G;setTimeout(()=>{if(G===g)next()},3000)}}
function choose(t){if(!G||G.locked)return;const q=G.qs[G.i],i=+t.dataset.i;if(q.opts[i].ok){t.classList.add('good');document.querySelectorAll('.opt').forEach(b=>b.disabled=true);good(q)}else wrong(q,t)}
function next(){G.i++;if(G.i>=G.qs.length)return finishWeek();viewQ()}
function finishWeek(){const sc=G.score,r=baremo(sc);S.best[G.w.id]=Math.max(S.best[G.w.id]||0,sc);save();sfx.win();if(r.s>=2)confetti();const nm=S.name?`, ${esc(S.name)}`:'';const msg=r.s===3?`¡Lo lograste${nm}! 🏆`:r.s===2?`Lo estamos logrando${nm} 🌟`:`Requerimos reforzar${nm} 🌱`;view(`<div class="res ${G.w.cls}">${MAS()}<div class="bigstars">${stars(r.s)}</div><div class="dif">${G.w.dif}</div><h2>${msg}</h2><p><b>${sc} / 10 puntos</b> en ${G.w.name}<br>${r.t} — ${r.d}</p>${G.fails.length?`<div class="baremo" style="text-align:left"><b>📝 Para reforzar (2°):</b><br>• ${G.fails.map(f=>esc(f.fb)).join('<br>• ')}</div>`: `<div class="baremo">✅ ¡Sin fallos! Perfecto para 2°.</div>`}<div class="btns"><button class="cta" data-act="again">Jugar otra vez</button><button class="cta alt" data-act="quit">Mapa semanas</button></div></div>`);mood('cheer');say(msg+'. Sacaste '+sc+' de 10.');G=null}
function quit(){G=null;try{speechSynthesis.cancel()}catch(e){}viewHome()}
const ACT={start,home:viewHome,week(t){const w=WEEKS.find(x=>x.id===t.dataset.id);sfx.pop();LAST=w;viewIntro(w)},begin(){if(LAST)startWeek(LAST)},quit,opt:choose,say(){if(G)say(G.qs[G.i].say)},again(){if(LAST)viewIntro(LAST)},voice(){S.voice=!S.voice;save();if(!S.voice){try{speechSynthesis.cancel()}catch(e){}}document.querySelectorAll('[data-act="voice"]').forEach(b=>b.textContent=voiceLbl())},rename(){viewWelcome()}};
$('#view').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;ac();const f=ACT[t.dataset.act];if(f)f(t)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#name'))start()});
(function deep(){try{const u=new URL(location.href);const s=u.searchParams.get('semana');if(s){const m={1:'s1',2:'s2',3:'s3',4:'s4'}[s];const w=WEEKS.find(x=>x.id===m);if(w){if(!S.name){S.name='';}viewIntro(w);return}}if(S.name)viewHome();else viewWelcome();}catch(e){if(S.name)viewHome();else viewWelcome()}})();
})();
</script>
